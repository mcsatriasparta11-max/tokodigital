<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toko Digital Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins', sans-serif;
}

body{
  background:#0f172a;
  color:white;
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 20px;
  background:#1e293b;
}

.cart-btn{
  background:#22c55e;
  padding:8px 15px;
  border-radius:10px;
  cursor:pointer;
}

/* PRODUK */
.container{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:20px;
}

.card{
  background:#1e293b;
  border-radius:15px;
  padding:15px;
  transition:0.3s;
}

.card:hover{
  transform:translateY(-5px);
}

.card img{
  width:100%;
  border-radius:10px;
}

.price{
  color:#38bdf8;
  font-weight:bold;
}

.btn{
  margin-top:10px;
  padding:10px;
  background:#22c55e;
  text-align:center;
  border-radius:10px;
  cursor:pointer;
}

/* CART */
.cart{
  position:fixed;
  right:-100%;
  top:0;
  width:300px;
  height:100%;
  background:#1e293b;
  padding:20px;
  transition:0.3s;
}

.cart.active{
  right:0;
}

.cart h2{
  margin-bottom:10px;
}

.cart-item{
  margin-bottom:10px;
  border-bottom:1px solid #333;
  padding-bottom:5px;
}

.checkout{
  margin-top:15px;
  padding:10px;
  background:#38bdf8;
  text-align:center;
  border-radius:10px;
  cursor:pointer;
}
</style>
</head>

<body>

<header>
  <h2>🛒 Toko Digital Pro</h2>
  <div class="cart-btn" onclick="toggleCart()">Cart (<span id="count">0</span>)</div>
</header>

<div class="container">

  <div class="card">
    <img src="https://via.placeholder.com/300x200">
    <h3>Ebook Bisnis</h3>
    <p class="price">50000</p>
    <div class="btn" onclick="addToCart('Ebook Bisnis',50000)">Tambah</div>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/300x200">
    <h3>Template Undangan</h3>
    <p class="price">30000</p>
    <div class="btn" onclick="addToCart('Template Undangan',30000)">Tambah</div>
  </div>

</div>

<!-- CART -->
<div class="cart" id="cart">
  <h2>Keranjang</h2>
  <div id="cart-items"></div>
  <h3>Total: Rp <span id="total">0</span></h3>
  <div class="checkout" onclick="checkout()">Checkout</div>
</div>

<script>
let cart = [];

function toggleCart(){
  document.getElementById("cart").classList.toggle("active");
}

function addToCart(name,price){
  cart.push({name,price});
  updateCart();
}

function updateCart(){
  let items = document.getElementById("cart-items");
  let total = 0;
  items.innerHTML = "";

  cart.forEach(item=>{
    total += item.price;
    items.innerHTML += `<div class="cart-item">${item.name} - Rp ${item.price}</div>`;
  });

  document.getElementById("total").innerText = total;
  document.getElementById("count").innerText = cart.length;
}

function checkout(){
  let message = "Saya mau beli:%0A";
  cart.forEach(item=>{
    message += `- ${item.name} (Rp ${item.price})%0A`;
  });

  window.open("https://wa.me/6281234567890?text=" + message);
}
</script>

</body>
</html>
